# =============================================================================
# grin-miner config — Apple Silicon CPU lean miner (Grin testnet by default)
#
# Usage: copy this to the repo root as ./grin-miner.toml (grin-miner looks in
# the working dir and next to the executable), point stratum_server_addr at your
# node (or a pool) below, then run:
#     ./target/release/grin-miner
#
# This config uses the C32 lean CPU plugin (cuckatoo_lean_cpu_compat_32) added
# by this branch's arm64 CMakeLists support. ~1 GB RAM, slow, but it is the CPU
# path that fits a normal Mac and solves REAL Cuckatoo32 at testnet's low
# difficulty. (Mainnet works too — just point at a mainnet node/pool on port
# 3416/3333; CPU lean is far too slow to be useful on mainnet, though.)
# =============================================================================

#########################################
### LOGGING CONFIGURATION             ###
#########################################
[logging]
log_to_stdout = true
stdout_log_level = "Info"        # bump to "Debug" if the stratum connection misbehaves
log_to_file = true
file_log_level = "Debug"
log_file_path = "grin-miner.log"
log_file_append = true

#########################################
### MINING CLIENT CONFIGURATION       ###
#########################################
[mining]

# Show the terminal UI. Set false to just stream log lines (handy over SSH / for
# capturing output to share). The miner works either way.
run_tui = true

# ---- Stratum endpoint -------------------------------------------------------
# Standard grin-miner usage: mine against YOUR OWN grin node's built-in stratum.
# Grin's native stratum port is 3416 (mainnet) / 13416 (testnet). Start the node
# with `enable_stratum_server = true` in grin-server.toml (testnet adds --testnet)
# and a wallet listening so the node can build the coinbase. The miner then
# connects to it locally:
stratum_server_addr = "127.0.0.1:13416"   # testnet local node (mainnet: 127.0.0.1:3416)

# The node's built-in stratum needs no login. To mine to a POOL instead, point
# stratum_server_addr at the pool's public host:port and set the login to
# whatever the pool documents (many Grin pools use address-as-identity, i.e.
# <grin_address>.<worker_name>). Example:
#stratum_server_addr     = "pool.example.com:13333"
#stratum_server_login    = "tgrin1youraddress.worker1"
#stratum_server_password = "x"

# The node's stratum is plain TCP (no TLS). Leave false.
stratum_server_tls_enabled = false

# Where grin-miner looks for *.cuckooplugin. With a normal `cargo build --release`
# the plugins land in target/release/plugins, which is the default search path,
# so this is usually left commented. Uncomment + set an absolute path only if you
# moved the binary away from its target/ tree.
#miner_plugin_dir = "/absolute/path/to/grin-miner/target/release/plugins"

###############################################################
### SOLVER PLUGIN — C32 LEAN CPU (Apple Silicon)            ###
###############################################################

# The only enabled solver: lean Cuckatoo32 on CPU.
#   - matches the job's edge_bits = 32 (the live network PoW)
#   - ~1 GB RAM (vs ~90 GB for a mean solver)
#   - slow, but correct; fine for testnet mining / pool testing
[[mining.miner_plugin_config]]
plugin_name = "cuckatoo_lean_cpu_compat_32"
[mining.miner_plugin_config.parameters]
# Thread count for the lean trimmer. Start at (physical cores - 1) to leave the
# machine responsive; e.g. 8 on an M4 Max (12-core). More threads != linear gain
# for the lean solver — tune by watching graphs/sec in the TUI.
nthreads = 8
# Optional: number of trimming rounds. Default in the solver is fine; only set
# this if you are deliberately experimenting.
#ntrims = 256
